<title>MPP MES Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: guide rail (sections, steps, transport) on the left; a live MPP
   terminal on the right, drawn with the product's own Core stylesheet tokens.
   Single dark look on purpose -- the product itself is dark-only. */
:root {
  color-scheme: dark;
  /* product tokens, copied from Core/stylesheet.css */
  --mpp-neutral-10:#0B1220; --mpp-neutral-20:#111A2E; --mpp-neutral-30:#172238; --mpp-neutral-40:#1F2C44;
  --mpp-neutral-50:#2C3A55; --mpp-neutral-60:#425270; --mpp-neutral-70:#697A98; --mpp-neutral-80:#9AA8BF;
  --mpp-neutral-90:#C9D2E0; --mpp-neutral-100:#F0F3F8;
  --mpp-accent-20:#093240; --mpp-accent-40:#126680; --mpp-accent-50:#1888A8; --mpp-accent-60:#22A8CC;
  --mpp-accent-70:#4BC2E0; --mpp-accent-80:#7DD4EA; --mpp-accent-90:#B0E5F3;
  --mpp-state-good-bg:#0F3A2A; --mpp-state-good-fg:#4ADE80; --mpp-state-good-border:#15532D;
  --mpp-state-bad-bg:#3A1416; --mpp-state-bad-fg:#F87171; --mpp-state-bad-border:#5C1E22;
  --mpp-vision-fg:#8B5CF6; --mpp-barcode-fg:#22D3EE; --mpp-both-fg:#F4B343;
  --mpp-cat-purple-bg:#2A1D45; --mpp-cat-purple-fg:#C4A8FF; --mpp-cat-purple-border:#3F2D66;
  --mpp-cat-orange-bg:#3A2410; --mpp-cat-orange-fg:#FFB57A; --mpp-cat-orange-border:#5C3818;
  --mpp-cat-green-bg:#16331F; --mpp-cat-green-fg:#7FD99A; --mpp-cat-green-border:#225033;
  --mpp-radius-sm:3px; --mpp-radius-md:5px; --mpp-radius-lg:8px; --mpp-radius-pill:999px;
  --mpp-space-1:4px; --mpp-space-2:8px; --mpp-space-3:12px; --mpp-space-4:16px; --mpp-space-5:24px; --mpp-space-6:32px;
  --mpp-font-sans:'Inter','Noto Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mpp-font-mono:'JetBrains Mono','Roboto Mono','Consolas',monospace;
  --mpp-fs-xs:14px; --mpp-fs-sm:15px; --mpp-fs-base:17px; --mpp-fs-md:19px; --mpp-fs-lg:22px; --mpp-fs-xl:27px;
  --mpp-fw-regular:400; --mpp-fw-medium:500; --mpp-fw-semibold:600; --mpp-fw-bold:700;
  --mpp-shadow-lg:0 8px 24px rgba(0,0,0,.5);
  --mpp-transition-fast:120ms ease-out; --mpp-transition-normal:200ms ease-out;
  --mpp-surface-canvas:var(--mpp-neutral-10); --mpp-surface-raised:var(--mpp-neutral-20);
  --mpp-surface-card:var(--mpp-neutral-30); --mpp-surface-overlay:var(--mpp-neutral-40);
  --mpp-surface-hover:var(--mpp-neutral-30); --mpp-surface-modal-scrim:rgba(0,0,0,.65);
  --mpp-surface-row-hover-subtle:rgba(255,255,255,.04);
  --mpp-border-subtle:var(--mpp-neutral-50); --mpp-border-default:var(--mpp-neutral-60); --mpp-border-strong:var(--mpp-neutral-70);
  --mpp-text-primary:var(--mpp-neutral-100); --mpp-text-secondary:var(--mpp-neutral-90);
  --mpp-text-tertiary:var(--mpp-neutral-70); --mpp-text-accent:var(--mpp-accent-70);
  --mpp-interactive-primary:var(--mpp-accent-50); --mpp-interactive-primary-hover:var(--mpp-accent-60);
  --mpp-focus-ring:0 0 0 3px rgba(34,168,204,.18);
  --pf-header-h:68px; --pf-touch-min:34px; --pf-content-pad:16px;
  --pf-status-warn-bg:rgba(244,179,67,.10); --pf-status-warn-fg:#F4B343;
  --pf-status-bad-bg:rgba(220,80,80,.10); --pf-status-bad-fg:#DC5050;
  --pf-status-good-bg:rgba(80,200,120,.10); --pf-status-good-fg:#50C878;
  /* marketing shell tokens */
  --rail-bg:#080E1A;
  --rail-w:340px;
}
body {
  background: var(--rail-bg);
  color: var(--mpp-text-primary);
  font-family: var(--mpp-font-sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--mpp-accent-70); outline-offset: 2px; }

/* ------------------------------------------------------------ shell layout */
.wt {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  min-height: 100vh;
}
.rail {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column;
  background: var(--rail-bg);
  border-right: 1px solid var(--mpp-neutral-40);
  min-width: 0;
}
.rail-brand {
  padding: 22px 22px 16px;
  border-bottom: 1px solid var(--mpp-neutral-40);
  display: flex; flex-direction: column; gap: 4px;
}
.rail-eyebrow {
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--mpp-accent-70); font-weight: 600;
}
.rail-brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.rail-brand p { margin: 0; color: var(--mpp-neutral-80); font-size: 13px; }

.rail-list { flex: 1; overflow-y: auto; padding: 10px 10px 16px; display: flex; flex-direction: column; gap: 2px; }
.sec-btn {
  display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center;
  width: 100%; text-align: left; padding: 9px 12px;
  background: transparent; border: 1px solid transparent; border-radius: var(--mpp-radius-md);
  color: var(--mpp-neutral-80); font-size: 14px; font-weight: 500;
}
.sec-btn:hover { background: var(--mpp-surface-row-hover-subtle); color: var(--mpp-text-primary); }
.sec-num {
  font-family: var(--mpp-font-mono); font-size: 12px; color: var(--mpp-neutral-70);
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid var(--mpp-neutral-50);
}
.sec-count { font-family: var(--mpp-font-mono); font-size: 11px; color: var(--mpp-neutral-70); }
.sec.done .sec-num { border-color: var(--mpp-accent-40); color: var(--mpp-accent-70); }
.sec.active > .sec-btn { background: var(--mpp-neutral-20); border-color: var(--mpp-neutral-50); color: var(--mpp-text-primary); }
.sec.active .sec-num { background: var(--mpp-accent-50); border-color: var(--mpp-accent-50); color: var(--mpp-neutral-100); }

.steps { list-style: none; margin: 4px 0 10px 25px; padding: 0 0 0 16px; border-left: 1px solid var(--mpp-neutral-50); display: flex; flex-direction: column; gap: 2px; }
.step-btn {
  width: 100%; text-align: left; background: transparent; border: 0; border-radius: var(--mpp-radius-sm);
  padding: 6px 8px; color: var(--mpp-neutral-70); font-size: 13px; position: relative;
}
.step-btn::before {
  content: ""; position: absolute; left: -21px; top: 12px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--rail-bg); border: 1px solid var(--mpp-neutral-60);
}
.step-btn:hover { color: var(--mpp-text-secondary); }
.step.done .step-btn::before { background: var(--mpp-accent-40); border-color: var(--mpp-accent-40); }
.step.active .step-btn { color: var(--mpp-text-primary); font-weight: 600; background: var(--mpp-surface-row-hover-subtle); }
.step.active .step-btn::before { background: var(--mpp-accent-70); border-color: var(--mpp-accent-70); box-shadow: 0 0 0 4px rgba(75,194,224,.18); }
.step-detail { padding: 2px 8px 8px; display: flex; flex-direction: column; gap: 8px; }
.who { display: grid; grid-template-columns: 62px 1fr; gap: 8px; font-size: 13px; line-height: 1.45; }
.who b { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding-top: 2px; }
.who.op b { color: var(--pf-status-warn-fg); }
.who.sys b { color: var(--mpp-accent-70); }
.who span { color: var(--mpp-text-secondary); }

.transport {
  border-top: 1px solid var(--mpp-neutral-40);
  padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 10px;
  background: var(--mpp-neutral-10);
}
.t-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.t-btn {
  height: 40px; min-width: 40px; padding: 0 10px; border-radius: var(--mpp-radius-md);
  border: 1px solid var(--mpp-border-default); background: transparent; color: var(--mpp-text-secondary);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 500;
}
.t-btn:hover { background: var(--mpp-surface-row-hover-subtle); color: var(--mpp-text-primary); }
.t-btn svg { width: 18px; height: 18px; fill: currentColor; }
.t-play { flex: 1; background: var(--mpp-interactive-primary); border-color: var(--mpp-interactive-primary); color: var(--mpp-neutral-100); font-weight: 600; }
.t-play:hover { background: var(--mpp-interactive-primary-hover); }
.t-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--mpp-neutral-70); font-variant-numeric: tabular-nums; }
.t-bar { height: 3px; background: var(--mpp-neutral-40); border-radius: 2px; overflow: hidden; }
.t-bar i { display: block; height: 100%; width: 0; background: var(--mpp-accent-70); }
.t-keys { font-size: 11px; color: var(--mpp-neutral-60); }
.t-keys kbd { font-family: var(--mpp-font-mono); border: 1px solid var(--mpp-neutral-50); border-radius: 3px; padding: 0 4px; color: var(--mpp-neutral-80); }

/* --------------------------------------------------------------- stage */
.stage {
  min-width: 0;
  padding-block: 28px 40px;
  padding-left: max(28px, env(safe-area-inset-left, 0px));
  padding-right: max(28px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
  background:
    radial-gradient(900px 400px at 70% -10%, rgba(24,136,168,.10), transparent 70%),
    var(--mpp-neutral-10);
}
.stage-head { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 20px; align-items: end; }
.stage-head h2 { margin: 2px 0 6px; font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; text-wrap: balance; }
.stage-head p { margin: 0; color: var(--mpp-neutral-80); max-width: 64ch; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: var(--mpp-radius-pill); border: 1px solid var(--mpp-neutral-50); color: var(--mpp-neutral-90); background: var(--mpp-neutral-20); }
.step-tag { font-family: var(--mpp-font-mono); font-size: 12px; color: var(--mpp-neutral-70); white-space: nowrap; }

.device-wrap { position: relative; width: 100%; overflow: hidden; padding-bottom: 2px; }
.device {
  width: 1080px; transform-origin: 0 0;
  border: 1px solid var(--mpp-neutral-50); border-radius: 10px; overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 6px rgba(255,255,255,.02);
  background: var(--mpp-surface-canvas);
}
.device-chrome {
  height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
  background: #060B15; border-bottom: 1px solid var(--mpp-neutral-40);
}
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--mpp-neutral-50); }
.url {
  flex: 1; max-width: 520px; margin: 0 auto; height: 22px; border-radius: 4px; background: var(--mpp-neutral-20);
  font-family: var(--mpp-font-mono); font-size: 12px; color: var(--mpp-neutral-80);
  display: flex; align-items: center; padding: 0 10px; gap: 6px;
}
.url em { font-style: normal; color: var(--mpp-neutral-60); }
.screen { position: relative; height: 640px; overflow: hidden; }
.caption-bar {
  display: grid; grid-template-columns: auto minmax(0,1fr); gap: 14px; align-items: start;
  padding: 14px 16px; border: 1px solid var(--mpp-neutral-40); border-radius: var(--mpp-radius-lg);
  background: var(--mpp-neutral-20);
}
.caption-num { font-family: var(--mpp-font-mono); font-size: 13px; color: var(--mpp-accent-70); padding-top: 1px; }
.caption-bar strong { display: block; font-size: 16px; margin-bottom: 2px; }
.caption-bar span { color: var(--mpp-neutral-80); font-size: 14px; }

/* tap indicator */
.tap {
  position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
  border: 2px solid var(--mpp-accent-70); background: rgba(75,194,224,.18);
  pointer-events: none; z-index: 3000; opacity: 0;
  transition: left 450ms cubic-bezier(.4,0,.2,1), top 450ms cubic-bezier(.4,0,.2,1), opacity 200ms;
}
.tap.on { opacity: 1; animation: tap 1.6s ease-out infinite; }
@keyframes tap { 0% { box-shadow: 0 0 0 0 rgba(75,194,224,.45); } 70% { box-shadow: 0 0 0 18px rgba(75,194,224,0); } 100% { box-shadow: 0 0 0 0 rgba(75,194,224,0); } }
.demo-target { outline: 2px solid var(--mpp-accent-70) !important; outline-offset: 3px; border-radius: var(--mpp-radius-md); }
.flash { animation: flash 900ms ease-out; }
@keyframes flash { from { background-color: rgba(75,194,224,.28); } }

/* ===================================================== MPP product UI */
.psc-pf-app { display: grid; grid-template-rows: var(--pf-header-h) auto 1fr; height: 100%; background: var(--mpp-surface-canvas); font-size: var(--mpp-fs-base); color: var(--mpp-text-primary); }
.psc-pf-header { height: var(--pf-header-h); background: var(--mpp-surface-raised); border-bottom: 1px solid var(--mpp-border-subtle); display: flex; align-items: center; padding: 0 var(--pf-content-pad); gap: var(--mpp-space-3); }
.psc-pf-app[data-mode="elevated"] .psc-pf-header { box-shadow: inset 0 -3px 0 var(--mpp-accent-60); }
.psc-pf-header-left { display: flex; align-items: center; gap: var(--mpp-space-2); min-width: 0; }
.psc-pf-header-center { flex: 1; display: flex; justify-content: center; }
.psc-pf-header-right { display: flex; align-items: center; gap: var(--mpp-space-3); }
.psc-pf-app-title { font-size: var(--mpp-fs-lg); font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
.burger { width: 40px; height: 40px; border-radius: var(--mpp-radius-md); border: 1px solid transparent; background: transparent; color: var(--mpp-text-secondary); font-size: 24px; }
.psc-pf-btn { min-height: var(--pf-touch-min); display: inline-flex; align-items: center; justify-content: center; gap: var(--mpp-space-2); padding: 0 var(--mpp-space-4); border-radius: var(--mpp-radius-md); border: 1px solid var(--mpp-border-default); background: var(--mpp-surface-card); color: var(--mpp-text-primary); font-size: var(--mpp-fs-base); font-weight: 500; white-space: nowrap; transition: background var(--mpp-transition-fast); }
.psc-pf-btn-large { min-height: 56px; font-size: var(--mpp-fs-md); padding: 0 var(--mpp-space-5); }
.psc-pf-btn-sm { min-height: 30px; font-size: var(--mpp-fs-xs); padding: 0 12px; }
.psc-pf-btn-secondary { background: transparent; border-color: var(--mpp-border-default); color: var(--mpp-text-secondary); }
.psc-pf-btn-primary { background: var(--mpp-interactive-primary); border-color: var(--mpp-interactive-primary); color: var(--mpp-text-primary); }
.psc-pf-btn-danger { background: var(--pf-status-bad-fg); border-color: var(--pf-status-bad-fg); color: var(--mpp-neutral-100); }
.psc-pf-btn[disabled] { background: var(--mpp-neutral-30); border-color: var(--mpp-neutral-50); color: var(--mpp-neutral-60); cursor: not-allowed; }
.psc-pf-btn-elevated { background: var(--mpp-neutral-30); color: var(--mpp-neutral-70); border-color: var(--mpp-neutral-50); }
.psc-pf-app[data-mode="elevated"] .psc-pf-btn-elevated { background: var(--mpp-accent-60); border-color: var(--mpp-accent-60); color: var(--mpp-neutral-100); }
.psc-pf-pill { display: inline-flex; align-items: center; padding: 2px var(--mpp-space-2); border-radius: var(--mpp-radius-pill); font-size: var(--mpp-fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.psc-pf-pill-good { background: var(--pf-status-good-bg); color: var(--pf-status-good-fg); }
.psc-pf-pill-warn, .psc-pf-pill-hold { background: var(--pf-status-warn-bg); color: var(--pf-status-warn-fg); }
.psc-pf-pill-bad { background: var(--pf-status-bad-bg); color: var(--pf-status-bad-fg); }
.psc-pf-pill-info { background: var(--mpp-accent-20); color: var(--mpp-accent-80); }
.psc-pf-pill-mute { background: var(--mpp-neutral-30); color: var(--mpp-neutral-80); }

.psc-pf-terminal-cell-context { display: flex; align-items: center; gap: var(--mpp-space-3); padding: 6px var(--mpp-space-4); background: var(--mpp-surface-canvas); border: 1px solid var(--mpp-border-subtle); border-radius: var(--mpp-radius-md); }
.psc-pf-cell-context-label { font-size: var(--mpp-fs-xs); color: var(--mpp-text-tertiary); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.psc-pf-cell-context-value { font-size: var(--mpp-fs-md); font-weight: 600; color: var(--mpp-accent-60); letter-spacing: .02em; white-space: nowrap; }

.opbar { display: flex; align-items: center; gap: var(--mpp-space-3); padding: 8px var(--pf-content-pad); background: var(--mpp-surface-canvas); border-bottom: 1px solid var(--mpp-border-subtle); }
.op-avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--mpp-accent-20); color: var(--mpp-accent-80); border: 1px solid var(--mpp-accent-40); letter-spacing: .04em; }
.op-avatar.empty { background: var(--mpp-neutral-30); color: var(--mpp-neutral-70); border-color: var(--mpp-neutral-50); }
.op-avatar.sup { background: var(--mpp-cat-purple-bg); color: var(--mpp-cat-purple-fg); border-color: var(--mpp-cat-purple-border); }
.psc-pf-kpi-label { font-size: var(--mpp-fs-xs); color: var(--mpp-text-tertiary); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
.psc-pf-kpi-sub { font-size: var(--mpp-fs-xs); color: var(--mpp-text-secondary); letter-spacing: .02em; }
.psc-pf-kpi-value { font-size: 24px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.psc-pf-kpi-value-good { color: var(--pf-status-good-fg); } .psc-pf-kpi-value-warn { color: var(--pf-status-warn-fg); } .psc-pf-kpi-value-bad { color: var(--pf-status-bad-fg); }
.mono { font-family: var(--mpp-font-mono); letter-spacing: .03em; }
.grow { flex: 1; min-width: 0; }

.psc-pf-terminal-body { overflow: hidden; display: flex; flex-direction: column; padding: var(--pf-content-pad); gap: var(--mpp-space-3); min-height: 0; }
.psc-pf-terminal-header-row { display: flex; align-items: center; gap: var(--mpp-space-3); }
.psc-pf-terminal-title { font-size: var(--mpp-fs-md); font-weight: 600; }
.psc-pf-terminal-subtitle { font-size: var(--mpp-fs-sm); color: var(--mpp-text-tertiary); }
.help { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--mpp-border-subtle); background: transparent; color: var(--mpp-text-tertiary); font-size: 15px; font-weight: 700; }
.psc-pf-panel { background: var(--mpp-surface-raised); border: 1px solid var(--mpp-border-subtle); border-radius: var(--mpp-radius-md); padding: 14px var(--mpp-space-4); display: flex; flex-direction: column; gap: var(--mpp-space-3); min-width: 0; }
.psc-pf-panel-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.panel-title { font-size: var(--mpp-fs-base); font-weight: 600; }
.psc-pf-field { display: flex; flex-direction: column; gap: 6px; }
.psc-pf-field-label { font-size: var(--mpp-fs-sm); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: var(--mpp-text-secondary); }
.psc-pf-field-input { min-height: 40px; padding: 0 14px; border: 1px solid var(--mpp-border-default); border-radius: var(--mpp-radius-md); background: var(--mpp-surface-canvas); color: var(--mpp-text-primary); font-size: 16px; display: flex; align-items: center; gap: 8px; }
.psc-pf-field-input.mono { font-family: var(--mpp-font-mono); letter-spacing: .05em; }
.psc-pf-field-input.focus { border-color: var(--mpp-accent-60); box-shadow: var(--mpp-focus-ring); }
.psc-pf-field-input .ph { color: var(--mpp-neutral-60); }
.psc-pf-field-input .caret { display: inline-block; width: 2px; height: 20px; background: var(--mpp-accent-70); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.select-arrow { margin-left: auto; color: var(--mpp-text-tertiary); font-size: 12px; }

.tab-strip { display: flex; border-bottom: 1px solid var(--mpp-border-subtle); gap: 4px; }
.tab-item { padding: 10px var(--mpp-space-4); font-size: var(--mpp-fs-sm); font-weight: 500; color: var(--mpp-text-tertiary); border-bottom: 3px solid transparent; }
.tab-item-active { color: var(--mpp-accent-70); border-bottom-color: var(--mpp-accent-70); font-weight: 600; }

.psc-pf-queue { display: flex; flex-direction: column; gap: var(--mpp-space-2); }

function header(o) {

    <div class="psc-pf-terminal-cell-context" id="cellCtx">

    : `<button class="psc-pf-btn psc-pf-btn-secondary" id="btnSup">Supervisor Access</button>`;
  return `
  <div class="psc-pf-header">
    <div class="psc-pf-header-left"><button class="burger" aria-hidden="true">≡</button><span class="psc-pf-app-title">${o.title}</span></div>
    <div class="psc-pf-header-center">${ctx}</div>
    <div class="psc-pf-header-right">
      <button class="psc-pf-btn psc-pf-btn-secondary">Downtime</button>
      ${right}
    </div>
  </div>`;
}

function opbar(o) {
  const who = o.elevated ? SUP : (o.signedIn === false ? null : OP);

  if (!who) {
    return `<div class="opbar"><span class="op-avatar empty">--</span>
      <div class="grow"><div class="psc-pf-kpi-label">Operator</div><div class="psc-pf-kpi-sub">No operator signed in</div></div>
      ${shift}<button class="psc-pf-btn psc-pf-btn-primary" id="btnSignIn">Sign In</button></div>`;
  }
  return `<div class="opbar" id="opbar"><span class="op-avatar${o.elevated ? ' sup' : ''}">${who.ini}</span>
    <div class="grow"><div class="psc-pf-kpi-label">${o.elevated ? 'Supervisor (elevated)' : 'Operator'}</div><div style="font-weight:600">${who.ini} · ${who.name}</div></div>
    ${shift}<button class="psc-pf-btn psc-pf-btn-secondary">Change Operator</button></div>`;
}

function app(o, body, overlay) {
  return `<div class="psc-pf-app" data-mode="${o.elevated ? 'elevated' : 'operator'}">
    ${header(o)}${opbar(o)}

}

  return `<div class="psc-pf-terminal-header-row">

}

function field(label, value, o) {
  o = o || {};
  const inner = value
    ? (o.type ? `<span data-type="${value}"></span>${o.focus ? '<span class="caret"></span>' : ''}` : `<span>${value}</span>`)
    : `<span class="ph">${o.ph || ''}</span>${o.focus ? '<span class="caret"></span>' : ''}`;
  return `<div class="psc-pf-field"${o.style ? ` style="${o.style}"` : ''}>
    <span class="psc-pf-field-label">${label}</span>
    <div class="psc-pf-field-input${o.mono ? ' mono' : ''}${o.focus ? ' focus' : ''}" ${o.id ? `id="${o.id}"` : ''}>${inner}${o.select ? '<span class="select-arrow">▼</span>' : ''}</div></div>`;

  const ic = kind === 'good' ? '✓' : kind === 'bad' ? '!' : 'i';
  return `<div class="toasts"><div class="toast ${kind}"><span class="ic">${ic}</span><div><b>${title}</b><span>${text}</span></div></div></div>`;

/* ================================================================ sections */

/* 1 ------------------------------------------------------------- sign-in */
{

    { title: 'Tap Sign In', op: 'Taps Sign In on the operator bar.', sys: 'Opens the numeric keypad. Production buttons stay locked until someone is present.', s: {}, target: '#btnSignIn' },

    { title: 'Working, and on the record', op: 'Sees their initials on the operator bar.', sys: 'Every basket, scrap entry and count from here carries MK. Supervisors cover breaks with their own PIN, not a shared login.', s: { signed: true, toast: true }, target: '#opbar' }
  ]
},

{
  id: 'diecast', title: 'Die cast: every cavity, every basket',
  pitch: 'The die-cast screen tracks the press counter, each cavity\'s basket and the scrap that never made it into one, then reconciles the shift so every shot is accounted for.',
  chips: ['Cavity-level LOTs', 'Counter-credited baskets', 'Additive scrap', 'Shift reconciliation'],

/* ================================================================== engine */
const FLAT = [];
SECTIONS.forEach((sec, si) => sec.steps.forEach((st, ti) => FLAT.push({ si, ti })));
let cur = 0, playing = false, timer = null, typers = [];
const STEP_MS = 5200;
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = id => document.getElementById(id);
const screen = $('screen'), device = $('device'), wrap = $('deviceWrap');
const tapEl = document.createElement('div'); tapEl.className = 'tap';

function pad2(n) { return String(n).padStart(2, '0'); }

function buildRail() {
  const { si, ti } = FLAT[cur];
  $('railList').innerHTML = SECTIONS.map((sec, i) => {
    const active = i === si;
    const steps = active ? `<ol class="steps">${sec.steps.map((st, j) => `
      <li class="step${j === ti ? ' active' : ''}${j < ti ? ' done' : ''}">
        <button class="step-btn" data-sec="${i}" data-step="${j}">${st.title}</button>
        ${j === ti ? `<div class="step-detail"><div class="who op"><b>Operator</b><span>${st.op}</span></div><div class="who sys"><b>MES</b><span>${st.sys}</span></div></div>` : ''}
      </li>`).join('')}</ol>` : '';
    return `<div class="sec${active ? ' active' : ''}${i < si ? ' done' : ''}">
      <button class="sec-btn" data-sec="${i}" data-step="0"><span class="sec-num">${pad2(i + 1)}</span><span>${sec.title.split(':')[0]}</span><span class="sec-count">${sec.steps.length}</span></button>${steps}</div>`;
  }).join('');
  const act = $('railList').querySelector('.sec.active');
  const list = $('railList');
  const top = act ? act.offsetTop - list.offsetTop : 0;
  if (act && (top < list.scrollTop || top + act.offsetHeight > list.scrollTop + list.clientHeight)) {
    list.scrollTop = top - 8;
  }
}

function typeAll() {
  typers.forEach(clearInterval); typers = [];
  screen.querySelectorAll('[data-type]').forEach(el => {
    const text = el.getAttribute('data-type');
    if (reduced) { el.textContent = text; return; }
    let i = 0; el.textContent = '';
    const t = setInterval(() => { i++; el.textContent = text.slice(0, i); if (i >= text.length) clearInterval(t); }, 70);
    typers.push(t);
  });
}

function placeTap(sel) {
  screen.querySelectorAll('.demo-target').forEach(e => e.classList.remove('demo-target'));
  const el = sel && screen.querySelector(sel);
  if (!el) { tapEl.classList.remove('on'); return; }
  el.classList.add('demo-target');
  const scale = device.getBoundingClientRect().width / device.offsetWidth || 1;
  const r = el.getBoundingClientRect(), sr = screen.getBoundingClientRect();
  tapEl.style.left = ((r.left - sr.left) / scale + Math.min(r.width / scale / 2, 160)) + 'px';
  tapEl.style.top = ((r.top - sr.top) / scale + Math.min(r.height / scale / 2, 40)) + 'px';
  tapEl.classList.add('on');
}

function fit() {
  const s = Math.min(1, wrap.clientWidth / device.offsetWidth);
  device.style.transform = `scale(${s})`;
  wrap.style.height = (device.offsetHeight * s) + 'px';
}

function render() {
  const { si, ti } = FLAT[cur];
  const sec = SECTIONS[si], st = sec.steps[ti];
  $('sEyebrow').textContent = `${pad2(si + 1)} · ${si === SECTIONS.length - 1 ? 'Configuration Tool' : 'Plant floor'}`;
  $('sTitle').textContent = sec.title;
  $('sPitch').textContent = sec.pitch;
  $('sChips').innerHTML = sec.chips.map(c => `<span class="chip">${c}</span>`).join('');
  $('sRoute').textContent = `Step ${ti + 1} of ${sec.steps.length}`;
  $('urlPath').textContent = sec.route;
  $('cNum').textContent = `${si + 1}.${ti + 1}`;
  $('cTitle').textContent = st.title;
  $('cText').textContent = `${st.op} ${st.sys}`;
  $('tSection').textContent = `Section ${si + 1} of ${SECTIONS.length}`;
  $('tOverall').textContent = `Step ${cur + 1} / ${FLAT.length}`;
  screen.innerHTML = sec.render(st.s);
  screen.appendChild(tapEl);
  typeAll();
  buildRail();
  requestAnimationFrame(() => placeTap(st.target));
  try { history.replaceState(null, '', '#' + sec.id); } catch (e) {}
  restartBar();
}

function restartBar() {
  const bar = $('tBar');
  bar.style.transition = 'none'; bar.style.width = '0';
  if (playing && !reduced) { void bar.offsetWidth; bar.style.transition = `width ${STEP_MS}ms linear`; bar.style.width = '100%'; }
  else bar.style.width = ((cur + 1) / FLAT.length * 100) + '%';
}

function go(i) { cur = Math.max(0, Math.min(FLAT.length - 1, i)); render(); schedule(); }
function goSec(si, ti) { const i = FLAT.findIndex(f => f.si === si && f.ti === (ti || 0)); if (i >= 0) go(i); }
function schedule() {
  clearTimeout(timer);
  if (!playing) return;
  timer = setTimeout(() => { if (cur >= FLAT.length - 1) { setPlaying(false); return; } go(cur + 1); }, STEP_MS);
}
function setPlaying(p) {
  playing = p;
  $('playLabel').textContent = p ? 'Pause' : 'Play';
  $('bPlay').setAttribute('aria-label', p ? 'Pause' : 'Play');
  $('playIcon').innerHTML = p ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  if (p && cur >= FLAT.length - 1) cur = -1, go(0); else { restartBar(); schedule(); }
}

$('bPrev').onclick = () => go(cur - 1);
$('bNext').onclick = () => go(cur + 1);
$('bPrevSec').onclick = () => { const { si, ti } = FLAT[cur]; goSec(ti > 0 ? si : Math.max(0, si - 1), 0); };
$('bNextSec').onclick = () => { const { si } = FLAT[cur]; if (si < SECTIONS.length - 1) goSec(si + 1, 0); else go(FLAT.length - 1); };
$('bPlay').onclick = () => setPlaying(!playing);
$('railList').addEventListener('click', e => {
  const b = e.target.closest('[data-sec]'); if (!b) return;
  goSec(+b.dataset.sec, +b.dataset.step);
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
  else if (e.key === ' ' && !e.target.closest('button')) { e.preventDefault(); setPlaying(!playing); }
});
window.addEventListener('resize', () => { fit(); placeTap(SECTIONS[FLAT[cur].si].steps[FLAT[cur].ti].target); });
